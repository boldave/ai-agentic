# ── Ścieżki ──────────────────────────────────────────────────────────────────
# Katalog ze skryptami pomocniczymi (tmux-spinner, tmux-agent-state).
# JEDYNE miejsce do zmiany po sklonowaniu repo w inne miejsce.
set -g @agent_bin "~/ai-agentic/tmux-config/bin"

# ── Ustawienia ───────────────────────────────────────────────────────────────
set -g mouse on

# Truecolor: bez tego motywy Neovima są przybliżane do palety 256 kolorów.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Zniszczenie sesji, do której jesteś podłączony, domyślnie odłącza klienta
# i wyrzuca z tmuxa. "off" przełącza wtedy na inną sesję, jeśli jakaś została.
set -g detach-on-destroy off

# ── Pasek statusu: dwie linie ────────────────────────────────────────────────
set -g status 3
# Animacja wymaga odświeżania paska; sekunda to najmniejsza wartość, jaką
# tmux przyjmuje - stąd jedna klatka na sekundę, a nie płynny ruch.
set -g status-interval 1
# Paleta Sonokai, ta sama co w Neovimie (bg #2c2e34 = Normal bg edytora).
set -g status-style "bg=#2c2e34,fg=#e2e2e3"

# Kreska oddzielająca pasek od treści terminala. Literalny ciąg zamiast
# generowania w shellu: tmux i tak przycina linię do szerokości klienta,
# a dzięki temu odświeżanie statusu nie odpala procesu.
set -g status-format[0] "#[fg=#414550]────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────"

# Znaczniki #[range=...] są niewidoczne, ale konieczne: to one mówią tmuxowi,
# w co kliknięto. Bez nich menu kontekstowe i przełączanie klikiem przestają
# działać — łatwo je zgubić przy edycji formatu.
#
# W range=user|X argument X może mieć najwyżej 15 bajtów, dlatego jest tu
# identyfikator sesji ($0, $1), a nie jej nazwa — nazwy bywają dłuższe.

# Górna linia: WSZYSTKIE sesje, bieżąca podświetlona. Klik przełącza.
# Animacja wyodrębniona do opcji - inaczej format staje się nieczytelny.
# #{E:...} rozwija wartość jako format już w kontekście konkretnego okna
# lub sesji, więc flagi rozwiązują się poprawnie.
#
# Znacznik stoi ZA nazwą, żeby jego kolor nie rozlał się na tekst.
set -g @mark_s "#{?@agent_busy_s, #(#{@agent_bin}/tmux-spinner),}"
set -g @mark_w "#{?@agent_busy_w, #(#{@agent_bin}/tmux-spinner),}"

# Kolejność stanów: pytanie > ukończenie > aktywność.
# Pomarańcz = agent czeka na odpowiedź, zielone światło = skończył.
#
# Zieleń gotowości (#5faf5f) jest ciemniejsza od zieleni Sonokai (#9ed072),
# którą pisany jest tekst aktywnej zakładki - inaczej oba myliły się ze sobą.
# To jedyny kolor w tej konfiguracji spoza palety motywu.
set -g status-format[1] "#[align=left]#[bg=#2c2e34] #{S:#[range=user|#{session_id}]#{?@agent_wait_s,#[fg=#f39660#,bg=#2c2e34]▐#[fg=#2c2e34#,bg=#f39660#,bold]#{session_name} ?#[fg=#f39660#,bg=#2c2e34]▌,#{?@agent_done_s,#[fg=#5faf5f#,bg=#2c2e34]▐#[fg=#2c2e34#,bg=#5faf5f#,bold]#{session_name}#[fg=#5faf5f#,bg=#2c2e34]▌,#{?#{==:#{session_name},#{client_session}},#[fg=#363944#,bg=#2c2e34]▐#[fg=#9ed072#,bg=#363944#,bold]#{session_name}#{E:@mark_s}#[fg=#363944#,bg=#2c2e34]▌,#[fg=#7f8490#,bg=#2c2e34] #{session_name}#{E:@mark_s} }}}#[norange default]#[bg=#2c2e34] }"

# Dolna linia: okna bieżącej sesji. Drugi argument #{W:...} dotyczy aktywnego.
set -g status-format[2] "#[fill=#363944]#[align=left]#[bg=#363944] #{W:#[range=window|#{window_index}]#{?@agent_wait_w,#[fg=#2c2e34#,bg=#f39660#,bold],#{?@agent_done_w,#[fg=#2c2e34#,bg=#5faf5f#,bold],#{?window_active,#[fg=#76cce0#,bg=#414550#,bold],#[fg=#7f8490#,bg=#363944]}}} #I #W#{?@agent_wait_w, ?,}#{E:@mark_w} #[norange default]#[bg=#363944]#{?window_end_flag,, }}"

# Jeden skrót obsługuje kliknięcia w obu liniach, więc rozróżniamy po tym,
# czy mouse_status_range wygląda na identyfikator sesji ($N).
#
# Sesje idą przez run-shell, bo argument -t w switch-client nie przechodzi
# przez rozwijanie formatów — trafiał tam dosłowny "#{mouse_status_range}".
# run-shell formaty rozwija, więc tmux dostaje gotowe "$0".
bind -n MouseDown1Status {
    if -F "#{m:$*,#{mouse_status_range}}" {
        run-shell "tmux switch-client -t '#{mouse_status_range}'"
    } {
        select-window -t =
    }
}

# Prawy przycisk: na górnej linii menu klikniętej sesji, na dolnej — domyślne
# menu okna tmuxa.
#
# Menu MUSI otwierać się synchronicznie, inaczej gubi się przy przeciągnięciu
# myszy z wciśniętym przyciskiem. Dlatego kliknięta sesja trafia najpierw do
# zmiennych (set -F rozwija formaty w locie), a menu korzysta już z nich —
# zamiast przechodzić przez asynchroniczny run-shell.
#
# @sessname wyciąga nazwę z identyfikatora, przechodząc pętlą po sesjach.
# Rename używa run-shell dopiero w akcji, bo -t nie rozwija formatów; tam
# asynchroniczność już nie przeszkadza, menu jest wtedy zamknięte.
bind -n MouseDown3Status {
    if -F "#{m:$*,#{mouse_status_range}}" {
        set -gF @sess "#{mouse_status_range}"
        set -gF @sessname "#{S:#{?#{==:#{session_id},#{@sess}},#{session_name},}}"
        display-menu -T "#[align=centre]#{@sessname}" -x M -y W \
            Next n "switch-client -n" \
            Previous p "switch-client -p" \
            '' \
            Renumber N "move-window -r" \
            Rename n "command-prompt -I '#{@sessname}' \"run-shell \\\"tmux rename-session -t '#{@sess}' '%%'\\\"\"" \
            '' \
            "New Session" s new-session \
            "New Window" w new-window \
            '' \
            "Kill Session" X "run-shell \"tmux kill-session -t '#{@sess}'\""
    } {
        display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W "#{?#{>:#{session_windows},1},,-}Swap Left" l { swap-window -t :-1 } "#{?#{>:#{session_windows},1},,-}Swap Right" r { swap-window -t :+1 } "#{?pane_marked_set,,-}Swap Marked" s { swap-window } '' Kill X { kill-window } Respawn R { respawn-window -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } Rename n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } '' "New After" w { new-window -a } "New At End" W { new-window }
    }
}

# Prawy przycisk wewnątrz panelu: menu podziału i zarządzania panelami.
#
# select-pane -t = najpierw ustawia panel pod kursorem jako bieżący, żeby
# podział trafił tam, gdzie kliknięto, a nie tam, gdzie był fokus.
#
# -c '#{pane_current_path}' otwiera nowy panel w katalogu klikniętego,
# inaczej tmux startuje w katalogu domowym.
#
# Uwaga: jeśli program w panelu sam obsługuje mysz (Neovim, lazygit),
# to on dostaje kliknięcie i menu się nie pokaże - tak działa tmux.
bind -n MouseDown3Pane {
    select-pane -t =
    display-menu -T "#[align=centre]#{pane_index}:#{pane_current_command}" -x M -y M \
        "Split Right" r "split-window -h -c '#{pane_current_path}'" \
        "Split Left"  l "split-window -h -b -c '#{pane_current_path}'" \
        "Split Down"  d "split-window -v -c '#{pane_current_path}'" \
        "Split Up"    u "split-window -v -b -c '#{pane_current_path}'" \
        '' \
        "#{?window_zoomed_flag,Unzoom,Zoom}" z "resize-pane -Z" \
        "#{?#{>:#{window_panes},1},,-}Kill Pane" X "kill-pane" \
        '' \
        "New Window" w "new-window -c '#{pane_current_path}'"
}

# ── Powiadomienie o końcu pracy agenta ───────────────────────────────────────
# Flagi @agent_done_w (okno) i @agent_done_s (sesja) ustawia bin/tmux-agent-state (hook Stop w Claude Code),
# a pasek wyżej rysuje przy oznaczonym oknie i sesji pomarańczową kropkę.
#
# Czyszczenie przy wejściu w okno: -q tłumi błąd, gdy flagi nie było.
# Dwa polecenia, bo osobno trzyma ją okno (-w) i sesja.
set-hook -g after-select-window {
    set -q -u -w @agent_done_w
    set -q -u -w @agent_wait_w
    set -q -u @agent_done_s
    set -q -u @agent_wait_s
}
set-hook -g client-session-changed {
    set -q -u @agent_done_s
    set -q -u @agent_wait_s
}

# ── Wtyczki ──────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'

# Linia uruchamiająca TPM musi pozostać ostatnia w pliku.
run ~/.tmux/plugins/tpm/tpm
