# ── Paths ────────────────────────────────────────────────────────────────────
# Directory holding the helper scripts (tmux-spinner, tmux-agent-state).
# THE ONLY line to change if you clone the repo somewhere else.
set -g @agent_bin "~/ai-agentic/tmux-config/bin"

# ── Settings ─────────────────────────────────────────────────────────────────
set -g mouse on

# Truecolor: without it Neovim themes get approximated to the 256-colour palette.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Killing the session you are attached to detaches the client by default and
# throws you out of tmux. "off" switches to another session instead, if one is left.
set -g detach-on-destroy off

# ── Status bar: three lines ──────────────────────────────────────────────────
set -g status 3
# The animation needs the bar to refresh; one second is the smallest value tmux
# accepts - hence one frame per second rather than smooth motion.
set -g status-interval 1
# Sonokai palette, the same as in Neovim (bg #2c2e34 = the editor's Normal bg).
set -g status-style "bg=#2c2e34,fg=#e2e2e3"

# The rule separating the bar from the terminal contents. A literal string rather
# than something generated in a shell: tmux trims the line to the client width
# anyway, and this way refreshing the status does not spawn a process.
set -g status-format[0] "#[fg=#414550]────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────"

# The #[range=...] markers are invisible but necessary: they are what tells tmux
# what was clicked. Without them the context menus and click-to-switch stop
# working — and they are easy to lose while editing the format.
#
# In range=user|X the argument X may be at most 15 bytes, which is why it carries
# the session id ($0, $1) rather than its name — names can be longer.

# Top line: ALL sessions, the current one highlighted. A click switches to it.
# The animation is pulled out into an option - otherwise the format becomes
# unreadable. #{E:...} expands the value as a format in the context of the
# particular window or session, so the flags resolve correctly.
#
# The marker sits AFTER the name so its colour does not bleed into the text.
set -g @mark_s "#{?@agent_busy_s, #(#{@agent_bin}/tmux-spinner),}"
set -g @mark_w "#{?@agent_busy_w, #(#{@agent_bin}/tmux-spinner),}"

# Order of states: question > finished > working.
# Orange = the agent is waiting for an answer, green light = it is done.
#
# The ready green (#5faf5f) is darker than the Sonokai green (#9ed072) used for
# the active tab's text - otherwise the two were mistaken for each other.
# It is the only colour here from outside the theme's palette.
set -g status-format[1] "#[align=left]#[bg=#2c2e34] #{S:#[range=user|#{session_id}]#{?@agent_wait_s,#[fg=#f39660#,bg=#2c2e34]▐#[fg=#2c2e34#,bg=#f39660#,bold]#{session_name} ?#[fg=#f39660#,bg=#2c2e34]▌,#{?@agent_done_s,#[fg=#5faf5f#,bg=#2c2e34]▐#[fg=#2c2e34#,bg=#5faf5f#,bold]#{session_name}#[fg=#5faf5f#,bg=#2c2e34]▌,#{?#{==:#{session_name},#{client_session}},#[fg=#363944#,bg=#2c2e34]▐#[fg=#9ed072#,bg=#363944#,bold]#{session_name}#{E:@mark_s}#[fg=#363944#,bg=#2c2e34]▌,#[fg=#7f8490#,bg=#2c2e34] #{session_name}#{E:@mark_s} }}}#[norange default]#[bg=#2c2e34] }"

# Bottom line: the windows of the current session. The second argument of
# #{W:...} applies to the active one.
set -g status-format[2] "#[fill=#363944]#[align=left]#[bg=#363944] #{W:#[range=window|#{window_index}]#{?@agent_wait_w,#[fg=#2c2e34#,bg=#f39660#,bold],#{?@agent_done_w,#[fg=#2c2e34#,bg=#5faf5f#,bold],#{?window_active,#[fg=#76cce0#,bg=#414550#,bold],#[fg=#7f8490#,bg=#363944]}}} #I #W#{?@agent_wait_w, ?,}#{E:@mark_w} #[norange default]#[bg=#363944]#{?window_end_flag,, }}"

# One binding serves clicks on both lines, so we tell them apart by whether
# mouse_status_range looks like a session id ($N).
#
# Sessions go through run-shell because the -t argument of switch-client is not
# put through format expansion — it received the literal "#{mouse_status_range}".
# run-shell does expand formats, so tmux gets a ready "$0".
bind -n MouseDown1Status {
    if -F "#{m:$*,#{mouse_status_range}}" {
        run-shell "tmux switch-client -t '#{mouse_status_range}'"
    } {
        select-window -t =
    }
}

# Right button: on the top line the clicked session's menu, on the bottom one —
# tmux's default window menu.
#
# The menu MUST open synchronously, otherwise it is lost when the mouse is
# dragged with the button held. That is why the clicked session goes into
# variables first (set -F expands formats on the spot) and the menu uses those —
# instead of going through an asynchronous run-shell.
#
# @sessname pulls the name out of the id by looping over the sessions.
# Rename uses run-shell only in the action, because -t does not expand formats;
# there the asynchrony no longer matters, the menu is closed by then.
bind -n MouseDown3Status {
    if -F "#{m:$*,#{mouse_status_range}}" {
        set -gF @sess "#{mouse_status_range}"
        set -gF @sessname "#{S:#{?#{==:#{session_id},#{@sess}},#{session_name},}}"
        display-menu -T "#[align=centre]#{@sessname}" -x M -y W \
            Next n "switch-client -n" \
            Previous p "switch-client -p" \
            '' \
            Renumber N "move-window -r" \
            Rename n "command-prompt -I '#{@sessname}' \"run-shell \\\"tmux rename-session -t '#{@sess}' '%%'\\\"\"" \
            '' \
            "New Session" s new-session \
            "New Window" w new-window \
            '' \
            "Kill Session" X "run-shell \"tmux kill-session -t '#{@sess}'\""
    } {
        display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W "#{?#{>:#{session_windows},1},,-}Swap Left" l { swap-window -t :-1 } "#{?#{>:#{session_windows},1},,-}Swap Right" r { swap-window -t :+1 } "#{?pane_marked_set,,-}Swap Marked" s { swap-window } '' Kill X { kill-window } Respawn R { respawn-window -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } Rename n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } '' "New After" w { new-window -a } "New At End" W { new-window }
    }
}

# Right button inside a pane: the split and pane management menu.
#
# select-pane -t = first makes the pane under the cursor current, so the split
# lands where you clicked rather than where the focus was.
#
# -c '#{pane_current_path}' opens the new pane in the clicked one's directory,
# otherwise tmux starts in the home directory.
#
# Note: if the program in the pane handles the mouse itself (Neovim, lazygit),
# it receives the click and the menu will not appear - that is how tmux works.
bind -n MouseDown3Pane {
    select-pane -t =
    display-menu -T "#[align=centre]#{pane_index}:#{pane_current_command}" -x M -y M \
        "Split Right" r "split-window -h -c '#{pane_current_path}'" \
        "Split Left"  l "split-window -h -b -c '#{pane_current_path}'" \
        "Split Down"  d "split-window -v -c '#{pane_current_path}'" \
        "Split Up"    u "split-window -v -b -c '#{pane_current_path}'" \
        '' \
        "#{?window_zoomed_flag,Unzoom,Zoom}" z "resize-pane -Z" \
        "#{?#{>:#{window_panes},1},,-}Kill Pane" X "kill-pane" \
        '' \
        "New Window" w "new-window -c '#{pane_current_path}'"
}

# ── Agent finished notification ──────────────────────────────────────────────
# The @agent_done_w (window) and @agent_done_s (session) flags are set by
# bin/tmux-agent-state (the Stop hook in Claude Code), and the bar above
# highlights the marked window and session.
#
# Clearing on entering a window: -q silences the error when the flag was not set.
# Two commands, because the window (-w) and the session hold it separately.
set-hook -g after-select-window {
    set -q -u -w @agent_done_w
    set -q -u -w @agent_wait_w
    set -q -u @agent_done_s
    set -q -u @agent_wait_s
}
set-hook -g client-session-changed {
    set -q -u @agent_done_s
    set -q -u @agent_wait_s
}

# ── Plugins ──────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'

# The line that runs TPM must stay last in the file.
run ~/.tmux/plugins/tpm/tpm
